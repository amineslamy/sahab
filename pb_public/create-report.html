<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت گزارش جدید - سامانه مدیریت تحقیقات</title>
    <!-- کامپایلر محلی Tailwind -->
    <script src="js/tailwindcss.js"></script>
    <!-- SDK پاکت‌بیس -->
    <script src="js/pocketbase.umd.js?v=1"></script>
    <!-- استایل محلی Quill Editor -->
    <link rel="stylesheet" href="css/quill.snow.css">
    <!-- استایل‌های محلی صفحه ثبت گزارش -->
    <link rel="stylesheet" href="css/create-report.css">
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- کانتینر اصلی فرم -->
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-sm border border-slate-200">

        <!-- هدر فرم -->
        <div class="bg-slate-800 text-white px-8 py-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">ثبت گزارش / سند جدید</h1>
                <p class="text-xs text-slate-300 mt-1">ورود اطلاعات ساختاریافته و پیوست مدارک به پایگاه داده</p>
            </div>
            <a href="index.html"
                class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-4 py-2 rounded-lg transition">
                ← بازگشت به داشبورد
            </a>
        </div>

        <!-- بدنه فرم -->
        <form id="create-report-form" class="p-8 space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- عنوان گزارش -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">عنوان گزارش / سند <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="report-title" required
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-800 focus:outline-none text-sm"
                        placeholder="مثال: ارزیابی تحلیلی آخرین تحولات میدانی...">
                </div>

                <!-- شماره اتوماسیون -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">شماره اتوماسیون / شناسه یکتا</label>
                    <input type="text" id="report-automation-no"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-800 focus:outline-none text-sm"
                        placeholder="مثال: ۱۴۰۳/الف/۱۲">
                </div>

                <!-- سطح طبقه‌بندی -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">سطح طبقه‌بندی <span
                            class="text-red-500">*</span></label>
                    <select id="report-classification" required
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-800 focus:outline-none text-sm bg-white">
                        <option value="normal">عادی</option>
                        <option value="confidential">محرمانه</option>
                        <option value="secret">سری</option>
                    </select>
                </div>

                <!-- موضوع (Topic) -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">موضوع مربوطه (Topics)</label>
                    <select id="report-topic"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-800 focus:outline-none text-sm bg-white">
                        <option value="">در حال بارگذاری موضوعات...</option>
                    </select>
                </div>

                <!-- کیس (Case) -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">کیس مربوطه (Case)</label>
                    <select id="report-case"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-800 focus:outline-none text-sm bg-white">
                        <option value="">در حال بارگذاری کیس‌ها...</option>
                    </select>
                </div>

                <!-- شرح متن گزارش -->
                <div class="md:col-span-2">

                    <!-- شرح متن گزارش (ادیتور پیشرفته) -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-slate-700 mb-2">شرح مفصل سند یا گزارش <span
                                class="text-red-500">*</span></label>
                        <!-- کانتینر ادیتور -->
                        <div id="editor-container" class="bg-white rounded-xl border border-slate-300 min-h-[250px]">
                        </div>
                    </div>
                </div>

                <!-- پیوست فایل -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">پیوست مدارک و مستندات (تصویر، سند،
                        PDF)</label>
                    <input type="file" id="report-attachments" multiple
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer">
                    <p class="text-xs text-slate-400 mt-1">امکان انتخاب چند فایل همزمان وجود دارد.</p>
                </div>
            </div>

            <!-- دکمه‌های عملیاتی -->
            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-200">
                <a href="index.html"
                    class="px-6 py-3 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold transition">
                    انصراف
                </a>
                <button type="submit" id="submit-btn"
                    class="px-8 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold transition shadow-sm">
                    ثبت و ذخیره‌سازی نهایی
                </button>
            </div>

        </form>
    </div>

    <!-- اسکریپت محلی Quill Editor -->
    <script src="js/quill.min.js"></script>
    <!-- اسکریپت اختصاصی صفحه -->
    <script src="js/create-report.js"></script>
</body>

</html>
