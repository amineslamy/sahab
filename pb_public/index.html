<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد سامانه مدیریت اخبار سحاب</title>

    <!-- ۱. استایل هدر و Tailwind -->
    <link rel="stylesheet" href="css/header.css">
    <script src="js/tailwindcss.js"></script>

    <!-- ۲. تعریف فونت وزیرمتن به‌صورت ۱۰۰٪ آفلاین -->
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- محل تزریق هدر داینامیک -->
    <div id="app-header"></div>

    <!-- محتوای اصلی داشبورد -->
    <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">آخرین گزارش‌ها و اخبار ثبت شده</h2>
            <button id="open-modal-btn" type="button"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition font-medium flex items-center gap-2 shadow cursor-pointer">
                <span>+ ثبت گزارش جدید</span>
            </button>
        </div>

        <!-- باکس نمایش لیست اخبار/گزارش‌ها -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <span class="text-sm font-medium text-slate-600">جدول اطلاعات</span>
                <span id="reports-count" class="text-xs bg-slate-200 px-2 py-1 rounded text-slate-700">۰ مورد</span>
            </div>

            <div id="reports-container" class="p-8 text-center text-slate-500">
                در حال دریافت اطلاعات از دیتابیس...
            </div>
        </div>
    </main>

    <!-- ترتیب صحیح فراخوانی اسکریپت‌ها -->
    <script src="js/pocketbase.umd.js?v=1"></script>
    <script src="js/main.js?v=2"></script>
    <script src="js/header.js"></script>
</body>

</html>
