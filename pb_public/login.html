<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه مدیریت و آرشیو تحقیقات</title>
    <!-- استفاده از CDN یا فایل لوکال Tailwind -->
    <script src="js/tailwindcss.js"></script>
    <!-- SDK رسمی پاکت‌بیس -->
    <script src="js/pocketbase.umd.js"></script>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">سامانه آرشیو تحقیقات</h1>
            <p class="text-sm text-slate-500">لطفاً جهت ورود به سیستم، شناسه و رمز عبور خود را وارد کنید</p>
        </div>

        <!-- پیام خطا -->
        <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg text-center"></div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="identity">نام کاربری یا ایمیل</label>
                <input type="text" id="identity" required
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                    placeholder="مثلاً: admin">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1" for="password">رمز عبور</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-md transition duration-200 flex items-center justify-center">
                <span>ورود به سامانه</span>
            </button>
        </form>
    </div>

    <script>
        // مقداردهی اولیه کلاینت PocketBase
        const pb = new PocketBase(window.location.origin);

        // اگر کاربر قبلاً لاگین کرده باشد، مستقیم به داشبورد هدایت می‌شود
        if (pb.authStore.isValid) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identity = document.getElementById('identity').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'در حال بررسی...';

            try {
                // احراز هویت با نام کاربری/ایمیل و رمز عبور
                const authData = await pb.collection('users').authWithPassword(identity, password);
                
                // ورود موفق -> انتقال به صفحه اصلی
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                errorDiv.innerText = 'نام کاربری یا رمز عبور اشتباه است.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'ورود به سامانه';
            }
        });
    </script>
</body>
</html>
