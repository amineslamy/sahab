<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>ورود به سامانه مدیریت و آرشیو تحقیقات (سحاب)</title>
    <!-- فایل‌های استاتیک لوکال پروژه -->
    <link rel="stylesheet" href="css/all.min.css">
    <script src="js/tailwindcss.js"></script>
    <script src="js/pocketbase.umd.js"></script>
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        }

        /* پس‌زمینه تصویری خالص بدون لایه پوششی گرادینت */
        .bg-vibrant-light {
            background: url('images/default.jpg') center/cover no-repeat fixed;
        }

        /* جلوه شیشه‌ای با شفافیت کمتر (کدرتر) برای نمایی مشخص‌تر و خوانایی بالاتر */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.35), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }
        /* افکت گرادینت برای عنوان */
        .brand-title-gradient {
            background: linear-gradient(135deg, #c506b5 0%, #06a5ad 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-vibrant-light min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- نورهای درخشان رنگی روی تصویر پس‌زمینه جهت افکت شیشه‌ای خیره‌کننده
    <div
        class="absolute -top-16 -right-16 w-[28rem] h-[28rem] bg-fuchsia-500 rounded-full blur-3xl opacity-70 pointer-events-none mix-blend-multiply">
    </div>
    <div
        class="absolute -bottom-16 -left-16 w-[28rem] h-[28rem] bg-teal-400 rounded-full blur-3xl opacity-70 pointer-events-none mix-blend-multiply">
    </div>
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-indigo-500 rounded-full blur-3xl opacity-50 pointer-events-none mix-blend-soft-light">
    </div> -->

    <div class="glass-card w-full max-w-md rounded-3xl shadow-2xl border border-white/60 p-8 sm:p-10 relative z-10">

        <!-- لوگو و برندینگ -->
        <div class="text-center mb-8">
            <div
                class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-indigo-600 via-indigo-500 to-teal-400 text-white rounded-2xl shadow-lg mb-4 ring-4 ring-indigo-50">
                <img src="images/logo.png" alt="لوگوی سحاب" class="w-10 h-10 object-contain">
            </div>
            <h1 class="text-2xl font-black brand-title-gradient tracking-tight">بانک اطلاعات آفلاین «سحاب»</h1>
            <p class="text-xs font-medium text-slate-500 mt-2">سامانه آرشیو، پردازش و هوشمندی داده‌ها</p>
        </div>

        <!-- پیام خطا -->
        <div id="error-message"
            class="hidden mb-6 p-3.5 bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold rounded-xl text-center shadow-sm">
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-2" for="identity">ایمیل</label>
                <div class="relative">
                    <input type="text" id="identity" required
                        class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-200 bg-white/80 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm text-slate-800 placeholder-slate-400 shadow-sm"
                        placeholder="username@sahab.local">
                    <span class="absolute right-3.5 top-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-base"></i>
                    </span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-2" for="password">رمز عبور</label>
                <div class="relative">
                    <input type="password" id="password" required
                        class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 bg-white/80 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm text-slate-800 placeholder-slate-400 shadow-sm"
                        placeholder="••••••••">
                    <span class="absolute right-3.5 top-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-base"></i>
                    </span>
                    <button type="button" id="toggle-password"
                        class="absolute left-3.5 top-3.5 text-slate-400 hover:text-indigo-600 focus:outline-none transition">
                        <i id="eye-icon" class="fa-solid fa-eye text-base"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-teal-500 hover:from-indigo-700 hover:to-teal-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition duration-200 active:scale-[0.99] flex items-center justify-center space-x-2 space-x-reverse">
                <span>ورود به سامانه</span>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400 font-medium">نسخه سامانه: ۲.۴.۰ • اجرا به‌صورت کاملاً محلی (Offline)
            </p>
        </div>
    </div>

    <script>
        const pb = new PocketBase(window.location.origin);

        if (pb.authStore.isValid) {
            window.location.href = 'index.html';
        }

        const loginForm = document.getElementById('login-form');
        const errorDiv = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';

            if (isPassword) {
                // تبدیل به آیکون چشم خط‌خورده
                eyeIcon.className = 'fa-solid fa-eye-slash text-base';
            } else {
                // تبدیل به آیکون چشم معمولی
                eyeIcon.className = 'fa-solid fa-eye text-base';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const identity = document.getElementById('identity').value.trim();
            const password = document.getElementById('password').value;

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>در حال بررسی...</span>';

            try {
                const authData = await pb.collection('users').authWithPassword(identity, password);
                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                errorDiv.innerText = 'نام کاربری یا رمز عبور اشتباه است.';
                errorDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>ورود به سامانه</span>';
            }
        });
    </script>
</body>

</html>
