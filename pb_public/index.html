<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد سامانه مدیریت اخبار سحاب</title>

    <!-- ۱. کامپایلر محلی Tailwind -->
    <script src="js/tailwindcss.js"></script>

    <!-- ۲. SDK محلی پاکت‌بیس -->
    <script src="js/pocketbase.umd.js?v=1"></script>

    <!-- ۳. تعریف فونت وزیرمتن به‌صورت ۱۰۰٪ آفلاین -->
    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- هدر / نوار بالای صفحه -->
    <header class="bg-indigo-900 text-white shadow-lg py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-4 space-x-reverse">
            <h1 class="text-xl font-bold">سامانه آرشیو و تحقیقات</h1>
            <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full text-indigo-200">نسخه ۱.۰ (پرتابل)</span>
        </div>

        <!-- اطلاعات کاربر لاگین شده -->
        <div class="flex items-center space-x-6 space-x-reverse">
            <div class="text-left">
                <div id="user-name" class="font-semibold text-sm">در حال بارگذاری...</div>
                <div id="user-role" class="text-xs text-indigo-300">...</div>
            </div>
            <button id="logout-btn"
                class="bg-red-500 hover:bg-red-600 text-white text-sm px-4 py-2 rounded-lg transition duration-200 shadow">
                خروج از حساب
            </button>
        </div>
    </header>

    <!-- محتوای اصلی داشبورد -->
    <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">آخرین گزارش‌ها و اخبار ثبت شده</h2>
            <button id="open-modal-btn" type="button"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition font-medium flex items-center gap-2 shadow cursor-pointer">
                <span>+ ثبت گزارش جدید</span>
            </button>
        </div>

        <!-- باکس نمایش لیست اخبار/گزارش‌ها -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200">
            <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                <span class="text-sm font-medium text-slate-600">جدول اطلاعات</span>
                <span id="reports-count" class="text-xs bg-slate-200 px-2 py-1 rounded text-slate-700">۰ مورد</span>
            </div>

            <div id="reports-container" class="p-8 text-center text-slate-500">
                در حال دریافت اطلاعات از دیتابیس...
            </div>
        </div>
    </main>

    

    <!-- فراخوانی اسکریپت اصلی -->
    <script src="js/main.js?v=2"></script>
</body>

</html>
