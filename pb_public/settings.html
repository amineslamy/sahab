<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/logo.png">
    <title>تنظیمات سامانه - مدیریت موضوعات و کیس‌ها</title>

    <link rel="stylesheet" href="css/header.css">
    <script src="js/tailwindcss.js"></script>

    <style>
        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Vazirmatn';
            src: url('fonts/Vazirmatn-Black.woff2') format('woff2');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        html {
            font-size: 17px;
        }

        * {
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif !important;
        }

        .tab-btn {
            position: relative;
            transition: all 0.2s ease-in-out;
        }

        .tab-btn.active {
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .gradient-title {
            background: linear-gradient(135deg, #c506b5 0%, #06a5ad 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 text-sm min-h-screen flex flex-col">

    <!-- هدر سراسری سامانه -->
    <div id="app-header"></div>

    <!-- نوار تب‌های مدیریت تنظیمات -->
    <nav class="bg-slate-100 border-b border-slate-200/80 shadow-inner px-4 mt-0 sticky top-[56px] z-30">
        <div class="max-w-[1600px] mx-auto flex justify-center">
            <div
                class="bg-slate-200/80 p-1 rounded-b-xl border-x border-b border-slate-300/60 shadow-sm flex gap-1.5 max-w-md w-full justify-between">
                <button onclick="switchSettingsTab('tab-topics')" id="btn-tab-topics"
                    class="tab-btn active flex-1 py-1.5 px-3 rounded-lg text-xs font-black text-center transition flex items-center justify-center gap-1.5">
                    <span>🏷️</span> <span>مدیریت موضوعات</span>
                </button>

                <button onclick="switchSettingsTab('tab-cases')" id="btn-tab-cases"
                    class="tab-btn flex-1 py-1.5 px-3 rounded-lg text-xs font-black text-center transition flex items-center justify-center gap-1.5">
                    <span>📁</span> <span>مدیریت کیس‌ها</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- کانتینر اصلی -->
    <main class="w-full max-w-[1200px] mx-auto p-4 sm:p-6 space-y-6 flex-1">

        <!-- ==================== تب اول: مدیریت موضوعات ==================== -->
        <div id="tab-topics" class="tab-content space-y-6">
            <!-- فرم افزودن موضوع -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="font-black text-base gradient-title mb-4">افزودن موضوع جدید</h3>
                <form id="form-add-topic" onsubmit="handleAddTopic(event)"
                    class="flex flex-col sm:flex-row gap-3 items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-black text-slate-700 mb-1">عنوان موضوع <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="input-topic-title" required placeholder="عنوان موضوع را وارد کنید..."
                            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none focus:border-indigo-600 bg-white">
                    </div>
                    <button type="submit"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-xs font-black transition shadow-sm whitespace-nowrap w-full sm:w-auto">
                        + ثبت موضوع
                    </button>
                </form>
            </div>

            <!-- جدول موضوعات -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 class="font-black text-base gradient-title">لیست موضوعات ثبت‌شده</h3>
                    <span id="topics-count" class="text-xs font-bold text-slate-500">تعداد: ۰</span>
                </div>
                <div class="w-full overflow-x-auto">
                    <table class="w-full text-right text-xs text-slate-700">
                        <thead class="bg-slate-100 font-black text-slate-600 uppercase border-b border-slate-200">
                            <tr>
                                <th class="p-3 w-16 text-center">ردیف</th>
                                <th class="p-3">عنوان موضوع</th>
                                <th class="p-3 w-44">تاریخ ایجاد</th>
                                <th class="p-3 w-40 text-center">عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="table-topics-body" class="divide-y divide-slate-200 font-medium">
                            <tr>
                                <td colspan="4" class="text-center p-8 text-slate-400">در حال دریافت اطلاعات...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ==================== تب دوم: مدیریت کیس‌ها ==================== -->
        <div id="tab-cases" class="tab-content hidden space-y-6">
            <!-- فرم افزودن کیس -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="font-black text-base gradient-title mb-4">افزودن کیس جدید</h3>
                <form id="form-add-case" onsubmit="handleAddCase(event)"
                    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 items-end">
                    <div>
                        <label class="block text-xs font-black text-slate-700 mb-1">عنوان کیس <span
                                class="text-red-500">*</span></label>
                        <input type="text" id="input-case-title" required placeholder="عنوان کیس را وارد کنید..."
                            class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold outline-none focus:border-indigo-600 bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-700 mb-1">کیس والد (اختیاری)</label>
                        <select id="select-case-parent"
                            class="w-full border border-slate-300 rounded-xl p-2 text-xs font-bold outline-none focus:border-indigo-600 bg-white">
                            <option value="">بدون والد (کیس اصلی)</option>
                        </select>
                    </div>
                    <div>
                        <button type="submit"
                            class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-xl text-xs font-black transition shadow-sm w-full">
                            + ثبت کیس
                        </button>
                    </div>
                </form>
            </div>

            <!-- جدول کیس‌ها -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 class="font-black text-base gradient-title">لیست کیس‌های ثبت‌شده</h3>
                    <span id="cases-count" class="text-xs font-bold text-slate-500">تعداد: ۰</span>
                </div>
                <div class="w-full overflow-x-auto">
                    <table class="w-full text-right text-xs text-slate-700">
                        <thead class="bg-slate-100 font-black text-slate-600 uppercase border-b border-slate-200">
                            <tr>
                                <th class="p-3 w-16 text-center">ردیف</th>
                                <th class="p-3">عنوان کیس</th>
                                <th class="p-3">کیس والد</th>
                                <th class="p-3 w-44">تاریخ ایجاد</th>
                                <th class="p-3 w-40 text-center">عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="table-cases-body" class="divide-y divide-slate-200 font-medium">
                            <tr>
                                <td colspan="5" class="text-center p-8 text-slate-400">در حال دریافت اطلاعات...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- اسکریپت‌ها -->
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/pocketbase.umd.js?v=1"></script>
    <script src="js/header.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
